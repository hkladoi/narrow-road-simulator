services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: narrow_road_simulator
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d narrow_road_simulator"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5433:5432"
    volumes:
      - narrow-road-postgres:/var/lib/postgresql/data

volumes:
  narrow-road-postgres:
